#train_zsm.yml
#### general settings
name: LunaTokis_Mamba2_N2N_4k_EB1
use_tb_logger: false #true
model: VideoSR_base_n2n
distortion: sr
scale: 1
gpu_ids: [4,5,6,7]  ### changes from [2] to [0] because I just use 1 gpu in google colab

#### datasets
datasets:
  train:
    name: Vimeo7
    mode: Microscopy
    interval_list: [1]
    random_reverse: true #false
    border_mode: false
    dataroot_GT: datasets/EB1_train/Out_HR_LR/HR/vimeo7_train_x2_HR.lmdb
    dataroot_LQ: datasets/EB1_train/Out_HR_LR/HR/vimeo7_train_x2_HR.lmdb
    cache_keys: datasets/EB1_train/Out_HR_LR/HR/vimeo7_train_x2_HR.lmdb/Vimeo7_train_keys.pkl

    N_frames: 7   # can change also to 3 see what is the difference?
    use_shuffle: true
    n_workers: 4  # per GPU
    batch_size: 8
    GT_size: 128
    LQ_size: 128
    use_flip: true
    use_rot: true
    color: RGB

#### network structures
network_G:
  which_model_G: LunaTokis_Microscopy_Mamba
  nf: 64
  nframes: 7   # can change also to 3 see what is the difference?
  groups: 8
  front_RBs: 5
  mid_RBs: 0
  back_RBs: 40
  HR_in: false
  norm: false
  vssm: 2

#### path
path:
  pretrain_model_G: experiments/LunaTokis_Mamba2_600k_Vimeo/models/latest_G.pth
  strict_load: false #true #
  resume_state: ~

#### training settings: learning rate scheme, loss
train:
  lr_G: !!float 1e-5
  lr_scheme: CosineAnnealingLR_Restart
  beta1: 0.9
  beta2: 0.99
  niter: 1000
  warmup_iter: 4000 #4000  # -1: no warm up
  T_period: [150000, 150000, 150000, 150000]
  restarts: [150000, 300000, 450000]
  restart_weights: [1, 1, 1]
  eta_min: !!float 1e-7

  pixel_criterion: cb
  pixel_weight: 1.0
  val_freq: !!float 5e3

  manual_seed: 0
  n2n: true

#### logger
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e2